{{define "main"}}{{with .Data}}<h1>Status</h1>
<section class="card">
<h2 class="card-title">the lab's parts</h2>
<dl class="facts">
{{range .Parts}}<dt>{{.Name}}</dt><dd>{{if eq .State "bad"}}<span class="bad">{{.Text}}</span>{{else if eq .State "none"}}<span class="dim">{{.Text}}</span>{{else}}{{.Text}}{{end}}</dd>
{{end}}</dl>
<p class="dim">Looked at {{.Looked}}. The lab looks once a minute; times are Brisbane's.</p>
</section>
{{end}}{{end}}
